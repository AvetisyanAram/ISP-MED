[options]
packages = find:
include_package_data = True
python_requires = >=3.10
package_dir =
    = ..
install_requires =
    torch==2.7.1
    hydra_core==1.3.2
    omegaconf==2.3.0
    numpy==1.26.4
    pandas==2.3.0
    scipy==1.15.0
    scikit_learn==1.7.1
    tqdm==4.67.1
    wfdb==4.3.0
    einops==0.8.1
    opt_einsum==3.4.0
    transformers==4.53.2
    safetensors==0.4.3
    huggingface_hub==0.30.0

[options.packages.find]
where = ..
include =
    classification
    classification.*

[options.package_data]
classification =
    configs/*.yaml
    configs/*/*.yaml

[options.entry_points]
console_scripts =
    classification-train = classification.train:main
    classification-predict = classification.predict:main
    classification-predict-ptbxl-test = classification.predict_ptbxl_test:main
    classification-prepare-ptbxl = classification.prepare_ptbxl:main
